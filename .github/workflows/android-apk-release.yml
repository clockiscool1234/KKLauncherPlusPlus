name: Android APK release

on:
  workflow_dispatch:
  push:
    tags:
      - dev-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease -x :app:lintVitalRelease

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/KKLauncher-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/KKLauncher-release-unsigned.apk

      - name: Publish dev-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: dev-build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-apks/*.apk
          body: |
            Automated development builds from `${{ github.ref_name }}`.

            `KKLauncher-debug.apk` is installable and signed with a generated debug key.
            `KKLauncher-release-unsigned.apk` is unsigned and intended for downstream signing.